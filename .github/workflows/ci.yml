name: SnoLab CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
      - "bugfix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: snolab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript + Tests + Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: TypeScript type check
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Run server security smoke tests
        run: npm run test:security

      - name: Run API load smoke test
        run: npm run test:load

      - name: Production build
        run: npm run build

      - name: Run browser E2E tests
        run: npm run test:e2e
